# Pipeline: verify → test → image (+ Trivy) → (manual approval) → GitOps release → live check.
#
# Every push and pull request runs the checks. A push to main that passes them builds the
# image and waits for approval in the "production" environment (Settings → Environments →
# production → Required reviewers); after "Approve and deploy" the release job commits the
# image tag, Argo CD syncs k3s and the job checks the live site. See frontend/README.md, "CI/CD".
name: CI/CD

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'deploy/**', '.github/workflows/ci-cd.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', 'deploy/**', '.github/workflows/ci-cd.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer commit on a PR makes the older run pointless; never cancel runs on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Build & static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check and build
        run: npm run build # astro check (types + templates), then the static build

      - name: Validate HTML
        run: npm run validate:html

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/frontend/dist 'frontend/dist/**/*.html'
          jobSummary: true

      # The exact files that are tested below are the ones that get deployed.
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  e2e:
    name: E2E & accessibility (Playwright)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: frontend/dist

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run tests
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: frontend/dist

      - name: Audit pages
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./frontend/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  charts:
    name: Helm charts & manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Lint, render and validate
        env:
          CRDS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
        run: |
          for chart in deploy/charts/*/; do
            name=$(basename "$chart")
            [ -s "$chart/Chart.yaml" ] || { echo "skip $name (empty)"; continue; }
            values=()
            [ -f "$chart/values-prod.yaml" ] && values=(-f "$chart/values-prod.yaml")
            helm lint "$chart" "${values[@]}"
            helm template "$name" "$chart" -n "$name" "${values[@]}" > "rendered-$name.yaml"
          done
          mapfile -t manifests < <(find deploy/argocd -name '*.yaml' -size +0)
          kubeconform -strict -summary -schema-location default -schema-location "$CRDS" \
            rendered-*.yaml "${manifests[@]}"
          deploy/scripts/check-resources.sh rendered-*.yaml

      - name: Secrets are encrypted
        run: deploy/scripts/check-secrets.sh

  image:
    name: Container image
    needs: [verify, e2e, lighthouse, charts]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  release:
    name: Release to production (GitOps)
    needs: [image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Required reviewers on this environment make the job wait for a manual "Approve and deploy".
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    permissions:
      contents: write
    # One release at a time; a newer approved build waits instead of cancelling a running one.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set the new image tag
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '.image.tag = strenv(TAG)' deploy/charts/portfolio/values-prod.yaml
          # A re-run of an already released commit: the tag is in Git, only the live check below is left.
          git diff --quiet && { echo "image.tag is already ${TAG::7}"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: portfolio ${TAG::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Wait for Argo CD and check the live site
        env:
          URL: ${{ vars.SITE_URL }}
        run: |
          [ -n "$URL" ] || { echo "::error::SITE_URL is not set in the production environment"; exit 1; }
          live=''
          for attempt in $(seq 1 40); do
            live=$(curl -fsS "$URL/version.txt" || true)
            [ "$live" = "$GITHUB_SHA" ] && break
            sleep 15
          done
          [ "$live" = "$GITHUB_SHA" ] || { echo "::error::$URL did not serve version ${GITHUB_SHA::7} within 10 minutes"; exit 1; }
          curl -fsS -o /dev/null "$URL/"
          curl -fsS -o /dev/null "$URL/command-center/"
          echo "Released ${GITHUB_SHA::7} to $URL" >> "$GITHUB_STEP_SUMMARY"
