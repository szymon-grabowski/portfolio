# Weekly update PRs; each one goes through the CI/CD checks before it can be merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: "@types/node"   # major follows the Node.js version in .nvmrc
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"    # until @astrojs/check supports the next major
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "node"          # changed together with .nvmrc and @types/node
        update-types: ["version-update:semver-major"]
