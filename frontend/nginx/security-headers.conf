# Included in every location: add_header in a location replaces the server-level ones.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
# Empty on production (then nginx sends nothing), "noindex, nofollow" on next. (map in nginx.conf).
add_header X-Robots-Tag $robots_tag always;
# HSTS is set by the ingress (TLS ends there). CSP needs hashes of the inline scripts: added later.
