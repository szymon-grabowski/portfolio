# Lean nginx for a static site: one worker, temp files in /tmp (read-only root filesystem works),
# the same cache rules as the current host nginx.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;

  # next. is a preview of the same build: keep it out of search results (production stays indexable).
  map $host $robots_tag {
    ~*^next\.  "noindex, nofollow";
    default    "";
  }
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  access_log /dev/stdout combined;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Behind a proxy: redirect /command-center to /command-center/ without the internal host and port.
    absolute_redirect off;

    # Optional server snippets mounted by the Helm chart (e.g. /api/status); none in a plain container.
    include /etc/nginx/site.d/*.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hashed build files never change.
    location /_astro/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # CV: shown in the browser's PDF viewer (inline), not offered as a download; kept out of search results.
    location = /cv.pdf {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      add_header Content-Disposition 'inline; filename="Szymon-Grabowski-CV.pdf"' always;
      add_header X-Robots-Tag "noindex" always;
      try_files $uri =404;
    }

    # HTML and everything else: always revalidate, so a deploy shows up at once.
    # Unknown paths get a real 404 (the terminal-style 404 page), not the start page with 200.
    error_page 404 /404.html;

    # Production allows crawling (file from the build); next. forbids it.
    location = /robots.txt {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      default_type text/plain;
      if ($host ~* ^next\.) { return 200 "User-agent: *\nDisallow: /\n"; }
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ =404;
    }
  }
}
