# Per-IP limits for the host nginx (http context). Installed by deploy/host/install-rate-limits.sh.
# Measured 2026-09-27: a full visit of the site peaks at 8 requests/s (17 in total); a Grafana
# dashboard at 30-36/s. The zone "showcase" (20 r/s, burst 100) for grafana./argocd./next. lives
# in conf.d/showcase.conf.
limit_req_zone  $binary_remote_addr zone=site:10m   rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# 429 instead of 503: clients and logs see "too many requests", not an outage.
limit_req_status  429;
limit_conn_status 429;
