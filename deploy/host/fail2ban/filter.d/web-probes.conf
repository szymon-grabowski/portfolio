# Requests for paths that never exist on this site but that scanners always try
# (secrets, VCS metadata, WordPress, PHP admin tools). Any status counts.
# Reads Traefik's access log (common log format, the same prefix nginx used).
[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "(?:GET|POST|HEAD|PUT) /(?:\.env|\.git|\.aws|\.ssh|\.DS_Store|wp-(?:admin|login|content|includes|config)|xmlrpc\.php|phpmyadmin|pma|adminer|cgi-bin|vendor/phpunit|server-status|config\.(?:json|php|yml)|backup|\.well-known/security\.txt\.bak)[^ "]* [^"]*" \d{3}
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
