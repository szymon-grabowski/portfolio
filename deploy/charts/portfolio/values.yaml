image:
  repository: ghcr.io/szymon-grabowski/portfolio
  tag: ""                      # commit SHA, set in values-prod.yaml (never "latest")
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 32Mi

priorityClassName: site-critical

ingress:
  hosts: []
  entrypoint: web
  tls:
    enabled: false
    secretName: ""   # existing TLS Secret
    certResolver: ""   # or Traefik ACME resolver
  hsts: false
  redirectWww: false

# /api/status for the Command Center LEDs: nginx proxies one fixed Prometheus query
# (site_status, recording rules in values/kube-prometheus-stack.yaml). No visitor input reaches Prometheus.
statusApi:
  enabled: true
  prometheusUrl: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  resolver: 10.43.0.10          # cluster DNS (k3s default); nginx resolves the upstream at request time
  # Production is still served outside the cluster, so it reads the status cross-origin.
  allowedOrigins: '^https://(www\.|next\.)?szymongrabowski\.dev$'
