alertmanager:
  enabled: false
grafana:
  enabled: false
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  create: false

kubelet:
  serviceMonitor:
    # On k3s the kubelet /metrics endpoint also serves the embedded apiserver and etcd metrics:
    # ~38k of ~45k series, none used by any dashboard. Keep kubelet_* only, without histograms.
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: kubelet_.*
      - action: drop
        sourceLabels: [__name__]
        regex: kubelet_.*_bucket

prometheusOperator:
  prometheusConfigReloader:
    resources:
      requests: { cpu: 5m, memory: 24Mi }   # 24h peak 21Mi
      limits: { memory: 48Mi }
  resources:
    requests: { cpu: 10m, memory: 96Mi }    # 24h peak 77Mi
    limits: { memory: 128Mi }
  admissionWebhooks:
    patch:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }

prometheus:
  prometheusSpec:
    scrapeInterval: 60s
    evaluationInterval: 60s
    query:                   # public Grafana: no query may exhaust the node
      maxSamples: 5000000
      timeout: 30s
      maxConcurrency: 4
    retention: 7d
    retentionSize: 4GB
    resources:
      requests: { cpu: 50m, memory: 320Mi }  # 24h peak 394Mi before the kubelet series cut
      limits: { memory: 512Mi }
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 6Gi

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 96Mi }    # 24h peak 76Mi
    limits: { memory: 128Mi }
  metricAllowlist:
    - kube_pod_.*
    - kube_deployment_.*
    - kube_node_.*
    - kube_persistentvolumeclaim_.*
    - kube_namespace_.*

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }    # 24h peak 24Mi, more collectors below
    limits: { memory: 64Mi }
  extraArgs:
    # Node Exporter Full needs uname for its job/node variables; the rest feed its other panels.
    - --collector.disable-defaults
    - --collector.cpu
    - --collector.meminfo
    - --collector.filesystem
    - --collector.loadavg
    - --collector.netdev
    - --collector.diskstats
    - --collector.pressure
    - --collector.uname
    - --collector.stat
    - --collector.time
    - --collector.timex
    - --collector.vmstat
    - --collector.netstat
    - --collector.sockstat
    - --collector.softnet
    - --collector.netclass
    - --collector.filefd
    - --collector.conntrack
    - --collector.entropy
    - --collector.schedstat
    - --collector.processes
    - --collector.tcpstat
    # pod veth pairs come and go; cAdvisor already covers per-pod traffic
    - --collector.netdev.device-exclude=^(veth.*|lo)$
    - --collector.netclass.ignored-devices=^(veth.*|lo)$
    # chart defaults, lost when extraArgs is overridden
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile   # backup age metric
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile
