# Alerts go to a Discord channel. The webhook URL is a password, so it lives only in a Secret made by hand
# (until SOPS): kubectl -n monitoring create secret generic alertmanager-discord --from-file=webhook-url=<file>
alertmanager:
  enabled: true
  alertmanagerSpec:
    secrets: [alertmanager-discord]   # mounted at /etc/alertmanager/secrets/alertmanager-discord/
    retention: 120h
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 64Mi }
  config:
    route:
      receiver: discord
      group_by: [alertname, target]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    # A critical alert silences the warning about the same thing (e.g. a certificate: 7 days mutes 21 days).
    inhibit_rules:
      - source_matchers: [severity="critical"]
        target_matchers: [severity="warning"]
        equal: [alertname, target]
      - source_matchers: [alertname="CertificateExpiresVerySoon"]
        target_matchers: [alertname="CertificateExpiresSoon"]
        equal: [target]
    receivers:
      - name: "null"   # the chart routes its Watchdog alert here
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager/secrets/alertmanager-discord/webhook-url
            send_resolved: true
grafana:
  enabled: false
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  create: false

additionalPrometheusRulesMap:
  site:
    groups:
      # One series per Command Center card: 1 = OK, 0 = failing, missing = no data.
      # The site reads only this metric, through nginx at /api/status (charts/portfolio).
      - name: site-status
        rules:
          - record: site_status
            expr: max(probe_success{target="production"})
            labels: { check: site }
          - record: site_status
            expr: max(probe_success{target="repository"})
            labels: { check: repository }
          - record: site_status
            expr: max(probe_success{target="ci"})
            labels: { check: cicd }
          - record: site_status
            expr: max(probe_success{target="argocd"})
            labels: { check: argocd }
          - record: site_status
            expr: >-
              min(kube_node_status_condition{condition="Ready", status="true"})
              * min(kube_deployment_status_replicas_available >= bool kube_deployment_spec_replicas)
            labels: { check: kubernetes }
          - record: site_status
            expr: max(probe_success{target="grafana"})
            labels: { check: grafana }
          - record: site_status
            expr: max(up{job="kube-prometheus-stack-prometheus", container="prometheus"})
            labels: { check: prometheus }
          - record: site_status
            expr: max(probe_success{target="loki"})
            labels: { check: loki }
      - name: site-alerts
        rules:
          - alert: SiteDown
            expr: probe_success{target="production"} == 0
            for: 3m
            labels: { severity: critical }
            annotations:
              summary: szymongrabowski.dev is not responding
              description: The blackbox probe of https://szymongrabowski.dev/ has failed for 3 minutes.
          # Let's Encrypt certificates are renewed 30 days before expiry: under 21 days means renewal is failing.
          - alert: CertificateExpiresSoon
            expr: min by (target) ((probe_ssl_earliest_cert_expiry - time()) / 86400) < 21
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: 'TLS certificate for {{ $labels.target }} expires in {{ $value | printf "%.0f" }} days'
              description: 'Traefik renews 30 days before expiry and has not. Check: kubectl -n kube-system logs deploy/traefik | grep -i acme'
          - alert: CertificateExpiresVerySoon
            expr: min by (target) ((probe_ssl_earliest_cert_expiry - time()) / 86400) < 7
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: 'TLS certificate for {{ $labels.target }} expires in {{ $value | printf "%.0f" }} days'
              description: Renew now, or visitors will see a certificate error.
          - alert: ShowcaseDown
            # argocd: only "no answer"; an answer with an unhealthy app is ArgoCDAppsNotHealthy below.
            expr: (probe_success{target=~"next|grafana"} == 0) or (probe_http_status_code{target="argocd"} != 200)
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: '{{ $labels.target }} is not responding'
              description: 'The blackbox probe of {{ $labels.instance }} has failed for 10 minutes.'
          # The probe checks that every Argo CD application is Synced and Healthy (blackbox-exporter.yaml).
          - alert: ArgoCDAppsNotHealthy
            expr: probe_success{target="argocd"} == 0 and probe_http_status_code{target="argocd"} == 200
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: An Argo CD application is not Synced and Healthy
              description: 'For 15 minutes. See https://argocd.szymongrabowski.dev'
      - name: node-alerts
        rules:
          # docs/infrastructure.md: the limits overcommit the 7.76 GiB on purpose; under 1 GiB free is the alarm line.
          - alert: NodeMemoryLow
            expr: node_memory_MemAvailable_bytes < 1024^3
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: 'Only {{ $value | humanize1024 }}B of memory available'
              description: 'Check: kubectl top pods -A --sort-by=memory'
          - alert: NodeDiskFilling
            expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: 'Root filesystem has {{ $value | humanizePercentage }} free'
              description: 'Largest users: Loki and Prometheus PVCs, container images (sudo k3s crictl rmi --prune).'
          - alert: NodeDiskAlmostFull
            expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.05
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: 'Root filesystem has {{ $value | humanizePercentage }} free'
              description: Pods will be evicted soon.
      - name: pod-alerts
        rules:
          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total[30m]) > 3
            labels: { severity: warning }
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $value | printf "%.0f" }} times in 30 min'
              description: 'Check: kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}'
          - alert: PodOOMKilled
            expr: >-
              (increase(kube_pod_container_status_restarts_total[15m]) > 0)
              and on(namespace, pod, container) kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            labels: { severity: warning }
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled'
              description: Its memory limit is too low for its current peak; see the RAM budget in docs/infrastructure.md.
          - alert: DeploymentNotAvailable
            expr: kube_deployment_status_replicas_available < kube_deployment_spec_replicas
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: '{{ $labels.namespace }}/{{ $labels.deployment }} has {{ $value }} available replicas, fewer than wanted'
              description: 'Check: kubectl -n {{ $labels.namespace }} get pods'

kubelet:
  serviceMonitor:
    # On k3s the kubelet /metrics endpoint also serves the embedded apiserver and etcd metrics:
    # ~38k of ~45k series, none used by any dashboard. Keep kubelet_* only, without histograms.
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: kubelet_.*
      - action: drop
        sourceLabels: [__name__]
        regex: kubelet_.*_bucket

prometheusOperator:
  prometheusConfigReloader:
    resources:
      requests: { cpu: 5m, memory: 24Mi }   # 24h peak 21Mi
      limits: { memory: 48Mi }
  resources:
    requests: { cpu: 10m, memory: 96Mi }    # 24h peak 77Mi
    limits: { memory: 128Mi }
  admissionWebhooks:
    patch:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }

prometheus:
  prometheusSpec:
    scrapeInterval: 60s
    evaluationInterval: 60s
    query:                   # public Grafana: no query may exhaust the node
      maxSamples: 5000000
      timeout: 30s
      maxConcurrency: 4
    retention: 7d
    retentionSize: 4GB
    resources:
      requests: { cpu: 50m, memory: 384Mi }  # 24h peak 394Mi before the kubelet series cut, ~180Mi after
      limits: { memory: 1Gi }                # headroom for heavy queries from the public Grafana
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 6Gi

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 96Mi }    # 24h peak 76Mi
    limits: { memory: 128Mi }
  metricAllowlist:
    - kube_pod_.*
    - kube_deployment_.*
    - kube_node_.*
    - kube_persistentvolumeclaim_.*
    - kube_namespace_.*

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }    # 24h peak 24Mi, more collectors below
    limits: { memory: 64Mi }
  extraArgs:
    # Node Exporter Full needs uname for its job/node variables; the rest feed its other panels.
    - --collector.disable-defaults
    - --collector.cpu
    - --collector.meminfo
    - --collector.filesystem
    - --collector.loadavg
    - --collector.netdev
    - --collector.diskstats
    - --collector.pressure
    - --collector.uname
    - --collector.stat
    - --collector.time
    - --collector.timex
    - --collector.vmstat
    - --collector.netstat
    - --collector.sockstat
    - --collector.softnet
    - --collector.netclass
    - --collector.filefd
    - --collector.conntrack
    - --collector.entropy
    - --collector.schedstat
    - --collector.processes
    - --collector.tcpstat
    # pod veth pairs come and go; cAdvisor already covers per-pod traffic
    - --collector.netdev.device-exclude=^(veth.*|lo)$
    - --collector.netclass.ignored-devices=^(veth.*|lo)$
    # chart defaults, lost when extraArgs is overridden
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile   # backup age metric
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile
