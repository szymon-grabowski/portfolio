# Alerts go by email to grabowski.szymon@proton.me. Off until an SMTP relay is chosen:
#   1. kubectl -n monitoring create secret generic alertmanager-smtp --from-literal=password='<SMTP password>'
#   2. fill smtp_smarthost / smtp_from / smtp_auth_username below
#   3. enabled: true
# Until then the rules below still evaluate; firing alerts are visible in Grafana (Alerting → Alert rules).
alertmanager:
  enabled: false
  alertmanagerSpec:
    secrets: [alertmanager-smtp]   # mounted at /etc/alertmanager/secrets/alertmanager-smtp/
    retention: 120h
    resources:
      requests: { cpu: 5m, memory: 32Mi }
      limits: { memory: 64Mi }
  config:
    global:
      smtp_smarthost: smtp.example.com:587        # set with the chosen relay
      smtp_from: alerts@example.com               # an address the relay may send from
      smtp_auth_username: CHANGE_ME
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      receiver: email
      group_by: [alertname, target]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
    receivers:
      - name: email
        email_configs:
          - to: grabowski.szymon@proton.me
            send_resolved: true
grafana:
  enabled: false
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  create: false

additionalPrometheusRulesMap:
  site:
    groups:
      # One series per Command Center card: 1 = OK, 0 = failing, missing = no data.
      # The site reads only this metric, through nginx at /api/status (charts/portfolio).
      - name: site-status
        rules:
          - record: site_status
            expr: max(probe_success{target="production"})
            labels: { check: site }
          - record: site_status
            expr: max(probe_success{target="repository"})
            labels: { check: repository }
          - record: site_status
            expr: max(probe_success{target="ci"})
            labels: { check: cicd }
          - record: site_status
            expr: max(probe_success{target="argocd"})
            labels: { check: argocd }
          - record: site_status
            expr: >-
              min(kube_node_status_condition{condition="Ready", status="true"})
              * min(kube_deployment_status_replicas_available >= bool kube_deployment_spec_replicas)
            labels: { check: kubernetes }
          - record: site_status
            expr: max(probe_success{target="grafana"})
            labels: { check: grafana }
          - record: site_status
            expr: max(up{job="kube-prometheus-stack-prometheus", container="prometheus"})
            labels: { check: prometheus }
          - record: site_status
            expr: max(probe_success{target="loki"})
            labels: { check: loki }
      - name: site-alerts
        rules:
          - alert: SiteDown
            expr: probe_success{target="production"} == 0
            for: 3m
            labels: { severity: critical }
            annotations:
              summary: szymongrabowski.dev is not responding
              description: The blackbox probe of https://szymongrabowski.dev/ has failed for 3 minutes.
          # Let's Encrypt certificates are renewed 30 days before expiry: under 21 days means renewal is failing.
          - alert: CertificateExpiresSoon
            expr: min by (target) ((probe_ssl_earliest_cert_expiry - time()) / 86400) < 21
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: 'TLS certificate for {{ $labels.target }} expires in {{ $value | printf "%.0f" }} days'
              description: Automatic renewal has not happened; check certbot on the server.
          - alert: CertificateExpiresVerySoon
            expr: min by (target) ((probe_ssl_earliest_cert_expiry - time()) / 86400) < 7
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: 'TLS certificate for {{ $labels.target }} expires in {{ $value | printf "%.0f" }} days'
              description: Renew now, or visitors will see a certificate error.

kubelet:
  serviceMonitor:
    # On k3s the kubelet /metrics endpoint also serves the embedded apiserver and etcd metrics:
    # ~38k of ~45k series, none used by any dashboard. Keep kubelet_* only, without histograms.
    metricRelabelings:
      - action: keep
        sourceLabels: [__name__]
        regex: kubelet_.*
      - action: drop
        sourceLabels: [__name__]
        regex: kubelet_.*_bucket

prometheusOperator:
  prometheusConfigReloader:
    resources:
      requests: { cpu: 5m, memory: 24Mi }   # 24h peak 21Mi
      limits: { memory: 48Mi }
  resources:
    requests: { cpu: 10m, memory: 96Mi }    # 24h peak 77Mi
    limits: { memory: 128Mi }
  admissionWebhooks:
    patch:
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 32Mi }

prometheus:
  prometheusSpec:
    scrapeInterval: 60s
    evaluationInterval: 60s
    query:                   # public Grafana: no query may exhaust the node
      maxSamples: 5000000
      timeout: 30s
      maxConcurrency: 4
    retention: 7d
    retentionSize: 4GB
    resources:
      requests: { cpu: 50m, memory: 384Mi }  # 24h peak 394Mi before the kubelet series cut, ~180Mi after
      limits: { memory: 1Gi }                # headroom for heavy queries from the public Grafana
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 6Gi

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 96Mi }    # 24h peak 76Mi
    limits: { memory: 128Mi }
  metricAllowlist:
    - kube_pod_.*
    - kube_deployment_.*
    - kube_node_.*
    - kube_persistentvolumeclaim_.*
    - kube_namespace_.*

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }    # 24h peak 24Mi, more collectors below
    limits: { memory: 64Mi }
  extraArgs:
    # Node Exporter Full needs uname for its job/node variables; the rest feed its other panels.
    - --collector.disable-defaults
    - --collector.cpu
    - --collector.meminfo
    - --collector.filesystem
    - --collector.loadavg
    - --collector.netdev
    - --collector.diskstats
    - --collector.pressure
    - --collector.uname
    - --collector.stat
    - --collector.time
    - --collector.timex
    - --collector.vmstat
    - --collector.netstat
    - --collector.sockstat
    - --collector.softnet
    - --collector.netclass
    - --collector.filefd
    - --collector.conntrack
    - --collector.entropy
    - --collector.schedstat
    - --collector.processes
    - --collector.tcpstat
    # pod veth pairs come and go; cAdvisor already covers per-pod traffic
    - --collector.netdev.device-exclude=^(veth.*|lo)$
    - --collector.netclass.ignored-devices=^(veth.*|lo)$
    # chart defaults, lost when extraArgs is overridden
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile   # backup age metric
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile
