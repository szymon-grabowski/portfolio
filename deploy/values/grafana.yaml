admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

resources:
  requests: { cpu: 20m, memory: 96Mi }
  limits: { memory: 384Mi }   # first start (database migrations) needs ~200Mi

persistence:
  enabled: true
  size: 1Gi
initChownData:
  enabled: false

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  unified_alerting:
    enabled: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.monitoring.svc:3100
